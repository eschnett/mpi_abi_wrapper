# Do the Open MPI legs die the way the i386 one did?
#
# The i386 answer, in ci-scripts/suite/README.md's "The i386 `rest` shard": that row
# was starving its own runner. Docker's default 64 MB /dev/shm, MPICH leaking shared
# segments into it, the tmpfs full 16 seconds into the suite, and from there SIGBUS
# for every later test, orphans piling up, load at 345 on four vCPUs and MemAvailable
# falling from 14.8 GB to 16 MB. The "runner lost communication at 49-52 minutes" was
# the consequence, not an environment reclaiming a long job.
#
# **Three things are already known about the Open MPI legs, and they say the same
# mechanism cannot be at work.**
#
#   1. They do not run in a container. The `suite` job installs its toolchain on the
#      runner, so its /dev/shm is the host's -- 7.9 GB, measured in the i386 probe's
#      own "for comparison" step -- and not 64 MB. The precondition is absent.
#   2. They finish. In run 32425661806 `openmpi / x86_64 / p2p` ran **50 min 41 s to
#      success** and aarch64's ran 50 min 13 s, which also falsifies "nothing above
#      about 45 minutes finishes here" for these legs.
#   3. Their recent failures are gate failures, not deaths: `aarch64 / rest` in that
#      run finished in 14 min 23 s and failed because of one unlisted failure,
#      `mpi_t/mpit_vars 1`. No leg in the last four runs carries "lost communication"
#      or "shutdown signal" at all.
#
# **And one thing is known to have died, with its cause already measured**: the `rma`
# shard, whose per-element memory cost took runners down at six minutes -- `transpose1`
# at 8.02 GB, `transpose7` at 10.93 + 3.93 GB -- which is an upstream Open MPI 5.x
# regression and why the matrix excludes that shard. That is *also* memory starvation,
# so the honest summary is that the two rows died of the same *outcome* by different
# *causes*: one test legitimately allocating 10 GB, against a leak plus orphans.
#
# **What is not measured is whether the legs that survive are trending the same way**,
# and that is what this probe is for. A 50-minute leg that finishes today can still be
# leaking; the i386 row also "finished" its early directories before the tmpfs filled.
# So: the two surviving shards, with the same ten-second instrument the i386 probe used,
# so the two logs can be read side by side --
#
#   - /dev/shm usage and entry count, which is where MPICH's leak was visible. Open MPI
#     also puts session files under /tmp, so those are counted too.
#   - load, process count and top RSS, which is where the orphans were visible.
#   - MemAvailable, which is what actually ran out.
#
# A timeout of its own, for the reason the i386 control leg established the hard way:
# a job that exceeds its GitHub timeout loses its log exactly as a reclaimed one does,
# so the container -- here the shell -- has to exit on its own terms.
#
# Disposable, like the rma and errcount probes: delete it with the branch once the
# answer is in ci-scripts/suite/README.md.

name: openmpi starvation probe

on:
  push:
    branches: [investigate-rma-dtp-openmpi5]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: openmpi starve / ${{ matrix.shard.name }}
    runs-on: ubuntu-24.04
    continue-on-error: true
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        shard:
          # The 50-minute leg: the longest thing this environment still runs to
          # completion, so the one where a trend would show if there is one.
          - name: p2p
            args: "--dirs=threads,pt2pt,part"
          # The 14-minute leg, as a shorter comparison from the same run.
          - name: rest
            args: "--skip-dirs=coll,rma,threads,pt2pt,part"
    env:
      # Exactly what the matrix leg being probed sets, so the only difference
      # between this and the CI row is that this one is being watched.
      MPITEST_TIMEOUT_MULTIPLIER: 1
      # Not optional and quiet when wrong: `prte` is what makes mpiexec-filter
      # pass --oversubscribe, and without it every test asking for more ranks
      # than the runner has cores fails to launch -- which would look like a
      # result and is not one.
      MPIEXEC_FILTER_KIND: prte
      # runtests prints nothing for a passing test, so without this the last line
      # before a stall is a directory header rather than a test name.
      RUNTESTS_VERBOSE: 1
    steps:
      - uses: actions/checkout@v6

      - name: Install the toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
              build-essential gfortran cmake python3 patch binutils \
              curl ca-certificates perl ccache

      - name: Set up paths
        run: |
          {
              echo "PREFIX=${RUNNER_TEMP}/opt/mpi-openmpi"
              echo "MPI_SRC_DIR=${RUNNER_TEMP}/mpi-src-openmpi"
              echo "CCACHE_DIR=${RUNNER_TEMP}/ccache"
          } >>"${GITHUB_ENV}"

      # The suite job's own key, restore-only: this probe must not write that
      # cache, and on a hit it starts with the same Open MPI 5.0.10 the row it is
      # about runs against.
      - name: Restore the MPI installation
        id: cache-mpi
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/opt/mpi-openmpi
          key: mpi1-openmpi-5.0.10-ubuntu-24.04-${{ runner.arch }}-${{ hashFiles('ci-scripts/install-*.sh') }}

      - name: Build Open MPI 5.0.10 if the cache missed
        if: steps.cache-mpi.outputs.cache-hit != 'true'
        run: |
          echo "cache miss -- building, which this probe would rather not have paid for"
          export PATH=/usr/lib/ccache:${PATH}
          ci-scripts/install-openmpi.sh "${PREFIX}" 5.0.10

      # **One step, because a background process cannot outlive the step that
      # started it and still be seen.** GitHub's log is per-step: a monitor
      # started in an earlier step writes into a closed stream. So the monitor,
      # the suite and the census are one block.
      - name: Watch the runner while the shard runs
        run: |
          say() { printf '\n=== %s\n' "$*"; }

          say "what this runner has before anything runs"
          df -h /dev/shm /tmp /
          free -m
          echo "  nproc: $(nproc)"
          echo "  /dev/shm entries: $(ls -A /dev/shm 2>/dev/null | wc -l)"
          echo "  /tmp Open MPI leftovers: $(ls -d /tmp/ompi.* /tmp/prte.* 2>/dev/null | wc -l)"

          # The same fields as ci-scripts/suite/i386-shm-probe.sh, deliberately, so
          # the two logs compare line for line. `ompi` counts session directories,
          # which is where Open MPI puts what MPICH puts in /dev/shm.
          monitor() {
            while :; do
              printf '[mon %s] /dev/shm %s  entries=%s  ompi_tmp=%s  memavail=%sMB  load=%s  procs=%s  top=[%s]\n' \
                "$(date -u +%H:%M:%S)" \
                "$(df -h /dev/shm | awk 'NR==2 {print $3 " of " $2}')" \
                "$(ls -A /dev/shm 2>/dev/null | wc -l)" \
                "$(ls -d /tmp/ompi.* /tmp/prte.* 2>/dev/null | wc -l)" \
                "$(awk '/MemAvailable/ {print int($2/1024)}' /proc/meminfo)" \
                "$(cut -d' ' -f1-3 /proc/loadavg)" \
                "$(ls -d /proc/[0-9]* 2>/dev/null | wc -l)" \
                "$(ps -eo rss=,comm= 2>/dev/null | sort -rn | head -3 \
                   | awk '{printf "%s %dMB; ", $2, $1/1024}')"
              sleep 10
            done
          }
          monitor &
          mon=$!
          trap 'kill "$mon" 2>/dev/null' EXIT

          # The CI invocation for this leg, verbatim from .github/workflows/ci.yaml's
          # `suite` job, including the inert --exclude that leg passes. The gate may
          # fail -- these rows are report-only and one of them has an unlisted
          # mpi_t/mpit_vars -- so its status is reported rather than obeyed.
          say "the ${{ matrix.shard.name }} shard, as CI runs it, at most 50 minutes"
          set +e
          timeout --foreground --kill-after=30s 50m \
            ci-scripts/suite/run-suite.sh "${PREFIX}/bin/mpicc" \
                --variant=starve-openmpi-x86_64 \
                --xfail=xfail-ci-openmpi.txt \
                --xfail=xfail-ci-openmpi-x86_64.txt \
                --flaky=flaky-ci-openmpi.txt \
                --exclude=exclude-ci-openmpi.txt \
                ${{ matrix.shard.args }}
          rc=$?
          set -e
          echo "  run-suite.sh exited ${rc}$([ "${rc}" = 124 ] && echo '  <-- TIMED OUT at 50m')"

          say "what is left afterwards"
          df -h /dev/shm /tmp /
          free -m
          echo "  /dev/shm entries left behind: $(ls -A /dev/shm 2>/dev/null | wc -l)"
          ls -A /dev/shm 2>/dev/null | head -20
          echo "  /tmp Open MPI leftovers: $(ls -d /tmp/ompi.* /tmp/prte.* 2>/dev/null | wc -l)"
          ls -d /tmp/ompi.* /tmp/prte.* 2>/dev/null | head -10
          echo "  orphans still running:"
          ps -eo pid=,etime=,rss=,comm= 2>/dev/null \
            | awk '$4 ~ /prte|mpiexec|runtests|^[a-z_]+$/ {print "    " $0}' | head -15

          kill "$mon" 2>/dev/null
          say "probe done"

      - name: Keep the TAP file and the suite's logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: openmpi-starve-${{ matrix.shard.name }}
          path: |
            build/suite-starve-openmpi-x86_64/summary.tap
            build/suite-starve-openmpi-x86_64/*.log
          if-no-files-found: warn
          retention-days: 30
