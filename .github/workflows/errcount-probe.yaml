# threads/pt2pt/mt_*probe*, run twice: with this project in the path and without.
#
# The four members of that family fail over Open MPI and pass over MPICH with the
# same wrapper build, which is where ci-scripts/suite/xfail-ci-openmpi.txt has left
# them as "not yet attributed" for two releases. The symptom is precise --
# MPI_ERR_COUNT out of MPI_Recv -- and the code path is short enough to state:
#
#     int recv_count = -1;
#     MPI_Iprobe(...); MPI_Get_count(status, MPI_INT, &recv_count);
#     MPI_Recv(buff, recv_count, MPI_INT, ...);          /* <-- aborts here */
#
# so recv_count reached MPI_Recv either still -1 (Get_count returned an error and
# left it alone, which is what MPI says an error does to an out parameter) or equal
# to MPI_UNDEFINED, which Open MPI returns when the status byte count is not a
# multiple of the datatype size and which this project faithfully maps to the ABI's
# own negative MPI_UNDEFINED. Either way the count is negative and MPI_Recv is right
# to reject it.
#
# **What no run so far has established is whose fault that is**, because the test has
# only ever been run through the wrapper. Reading the source got as far as: Open MPI's
# ob1 iprobe copies the whole status including _ucount on a match and leaves it
# untouched on a miss, and this project's status blob round-trips those bytes exactly,
# so neither side looks wrong on inspection. That is the point at which measuring beats
# reading.
#
# **The measurement is one binary built two ways.** The suite is configured twice
# against the same Open MPI -- once with `--with-mpi` pointing at this project's
# prefix, which is what CI does, and once pointing at Open MPI itself, which nothing
# has done -- and the same four tests run in each. If they fail both ways it is an
# Open MPI bug and the xfail lines can finally say so; if they fail only through the
# wrapper, the fault is ours and the status path is where to look.
#
# workflow_dispatch plus a branch-scoped push, for the reason the rma probe needed
# both: GitHub only offers dispatch for workflows already on the default branch.
# Disposable, like that one -- delete it with the branch once the answer is written
# down.

name: errcount probe

on:
  push:
    branches: [investigate-rma-dtp-openmpi5]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: errcount / ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Both architectures, because the family's membership moves between them and
        # a one-architecture answer would invite the same single-run mistake this
        # branch has already made three times.
        include:
          - arch: x86_64
            os: ubuntu-24.04
          - arch: aarch64
            os: ubuntu-24.04-arm
    env:
      MPIEXEC_FILTER_KIND: prte
      MPITEST_TIMEOUT_MULTIPLIER: 1
      RUNTESTS_VERBOSE: 1
    steps:
      - uses: actions/checkout@v6

      - name: Install the toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
              build-essential gfortran cmake python3 patch binutils \
              curl ca-certificates perl ccache

      - name: Set up paths
        run: |
          {
              echo "PREFIX=${RUNNER_TEMP}/opt/openmpi"
              echo "MPI_SRC_DIR=${RUNNER_TEMP}/mpi-src-openmpi"
              echo "MPIABI_SUITE_WORK=${RUNNER_TEMP}/suite-work"
              echo "MPIABI_SUITE_SRC=${RUNNER_TEMP}/suite-src"
              echo "CCACHE_DIR=${RUNNER_TEMP}/ccache"
          } >>"${GITHUB_ENV}"

      # The same key the suite job saves under, so a warm cache serves both.
      - name: Restore the MPI installation
        id: cache-mpi
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/opt/openmpi
          key: errcount-mpi1-openmpi-5.0.10-${{ matrix.os }}-${{ runner.arch }}-${{ hashFiles('ci-scripts/install-openmpi.sh') }}

      - name: Build and install Open MPI 5.0.10
        if: steps.cache-mpi.outputs.cache-hit != 'true'
        run: |
          export PATH=/usr/lib/ccache:${PATH}
          ci-scripts/install-openmpi.sh "${PREFIX}" 5.0.10

      - name: Save the MPI installation
        if: always() && steps.cache-mpi.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/opt/openmpi
          key: errcount-mpi1-openmpi-5.0.10-${{ matrix.os }}-${{ runner.arch }}-${{ hashFiles('ci-scripts/install-openmpi.sh') }}

      # **Leg one: through the wrapper.** run-suite.sh does the whole thing, and
      # --dirs=threads is the shard these live in. This is the configuration CI
      # already runs, reproduced here so that both legs are one run apart and no
      # difference can be blamed on the image or the day.
      - name: Through the wrapper
        run: |
          set +e
          ci-scripts/suite/run-suite.sh "${PREFIX}/bin/mpicc" \
              --variant=errcount-wrapped \
              --xfail=xfail-ci-openmpi.txt \
              --xfail=xfail-ci-openmpi-${{ matrix.arch }}.txt \
              --dirs=threads --no-dtp
          echo "run-suite.sh exited $?"
          exit 0

      - name: What the wrapped leg said about the family
        if: always()
        run: |
          tap="${MPIABI_SUITE_WORK}/summary.tap"
          echo "::group::mt_*probe* lines, wrapped"
          grep -E "mt_[im]?probe" "$tap" || echo "(no matching lines)"
          echo "::endgroup::"

      # **Leg two: no wrapper at all.** The same suite tree, configured against Open
      # MPI itself, and only the four programs built and run -- there is no need for
      # the rest of the directory to answer this question, and building it would cost
      # the time the shard already spends. mpiexec-filter is still used, because
      # prterun needs --oversubscribe here exactly as it does there and a difference
      # in launcher flags between the legs would be a difference in the experiment.
      - name: Native, for comparison
        run: |
          tree="${MPIABI_SUITE_SRC}"/mpich-*/test/mpi
          tree=$(echo $tree)   # glob -> path
          echo "suite tree: ${tree}"
          native="${RUNNER_TEMP}/suite-native"
          mkdir -p "${native}"
          ( cd "${native}" && "${tree}/configure" \
                --with-mpi="${PREFIX}" --enable-strictmpi --enable-fortran=no \
                > configure.log 2>&1 ) || { tail -20 "${native}/configure.log"; exit 1; }
          echo "configured against ${PREFIX} (no wrapper)"

          export MPIEXEC_FILTER_LAUNCHER="${PREFIX}/bin/mpiexec"
          for t in mt_probe_isendrecv mt_probe_sendrecv mt_iprobe_isendrecv mt_iprobe_sendrecv; do
              echo "::group::native ${t}"
              ( cd "${native}/threads/pt2pt" && make "$t" >/dev/null 2>&1 ) \
                  || { echo "  BUILD FAILED"; echo "::endgroup::"; continue; }
              set +e
              ( cd "${native}/threads/pt2pt" && \
                timeout 180 "${GITHUB_WORKSPACE}/ci-scripts/suite/mpiexec-filter" -n 2 "./$t" 2>&1 | tail -20 )
              echo "  exit=$?"
              set -e
              echo "::endgroup::"
          done
