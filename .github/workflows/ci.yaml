# CI for mpi_abi_wrapper.
#
# Every job below runs an existing entry point from ci-scripts/ rather than
# re-expressing its recipe here; those scripts are runnable by hand and are
# where the reasons live. NOTES.md #9 and #10 are what this file implements:
#
#   #10 oracle 1     the header and generator checks, "the cheapest job in CI"
#   #9               a job asserting the committed generated code is unchanged
#   #9 decision 19   the three consumption routes "exercised by CI rather than
#                    merely parsed" -- each must build *and run* a program
#   #9               MPI provisioned from pinned released tarballs, cached
#   #10              MPICH's C test suite, "the first oracle nothing in this
#                    repository wrote", over both implementations, each gated on
#                    its own committed expected-failure list
#
# Not here, deliberately, though the design calls for them: the MPI-3.0 floor
# row (ci-scripts/linux-floor.sh, some fifteen minutes) and the cross test.
# Excluding the floor row also removes the only coverage of the *toolchain*
# floor -- CMake 3.20, Python 3.8, gcc 9 -- which is the kind of drift
# HISTORY.md #3's S6 entry records as invisible everywhere else.
#
# Not here because the platform is not supported: FreeBSD. The row existed long
# enough to establish why (NOTES.md #13.4, HISTORY.md #2.16) and was dropped
# rather than left red -- a permanently failing row teaches nothing after the
# first run. `git show 236b99a` has the recipe if it is ever worth revisiting.

name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Not an unconditional true. A cache saved on a PR branch is invisible to
  # other branches while one saved on main is visible to every PR, so main is
  # what warms the from-source MPI caches. Cancelling a main run to start
  # another throws away a build every later PR would have restored in seconds.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  # --------------------------------------------------------------- no MPI
  # -DMPI_ABI_BUILD_WRAPPER=OFF never reaches find_package(MPI), so this job
  # needs no MPI on the host at all. It builds libmpi_abi and the three
  # header-compile object libraries, and registers exactly the six tests
  # CMakeLists.txt declares outside that block -- the five generator and header
  # checks, plus exported-symbols, whose libmpi_abi leg is oracle 1 itself and
  # needs no wrapper to run.
  checks:
    name: checks (no MPI)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      # poppler-utils is the one package the runner image lacks:
      # dev/check-c-bindings.py shells out to `pdftotext -layout` to read
      # MPI-5.0's Appendix A.3 out of the committed doc/mpi50-report.pdf.
      # cmake, python3, patch and binutils are already there, and newer than
      # apt's.
      - name: Install poppler-utils, for pdftotext
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends poppler-utils

      - name: Configure
        run: cmake -S . -B build -DMPI_ABI_BUILD_WRAPPER=OFF

      - name: Build
        run: cmake --build build -j"$(getconf _NPROCESSORS_ONLN)"

      # generated-up-to-date is NOTES.md #9's empty-diff gate: generate.py
      # --check regenerates in memory and exits non-zero on any difference,
      # writing nothing. The `regenerate` target is never run here -- it writes
      # into the source tree.
      #
      # --no-tests=error rather than an expected count written into YAML: it
      # catches "the five became zero" without becoming a second place a tally
      # has to be kept up to date.
      - name: Test
        run: ctest --test-dir build --output-on-failure --no-tests=error --timeout 300

      - name: Show CMake's check logs
        if: failure()
        run: |
          for log in build/CMakeFiles/CMakeConfigureLog.yaml \
                     build/CMakeFiles/CMakeError.log; do
              if [[ -f ${log} ]]; then
                  echo "::group::${log}"; cat "${log}"; echo "::endgroup::"
              fi
          done

  # ------------------------------------------------------- distro MPI rows
  # ci-scripts/linux-test.sh does everything: as root with apt it installs its
  # own packages, resolves mpicc through Debian's alternatives, configures,
  # builds, runs the full ctest, and separates its gating steps from the two
  # informational ones (symbol binding, dlmopen mode). It tails its own CMake
  # and build logs on failure, so this job adds no diagnostics of its own.
  #
  # Two ways this is weaker than `ci-scripts/run-linux-docker.sh` locally, both
  # worth knowing rather than assuming parity: the source tree is NOT mounted
  # read-only here, so the `patch -o -` property that mount was written to
  # catch is untested; and GitHub's runners are x86_64 while the local rows
  # were measured on aarch64.
  linux-distro:
    name: linux / ${{ matrix.mpi }} / ${{ matrix.arch }} (${{ matrix.image }})
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.image }}
    # Also the only backstop against a hung launcher: linux-test.sh calls ctest
    # with no --timeout and ctest's own default is 1500 s per test. These rows
    # are under two minutes plus the package install when they work.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # The image is part of the row and the two are not interchangeable.
          # Ubuntu 24.04's MPICH links libpmix and imports PMIx_Init while the
          # mpiexec.hydra in the same package is a PMI-1 server, so `mpiexec -n
          # 2` there returns two singletons and exit 0 rather than a two-rank
          # job -- with nothing of this project involved. Debian 13's MPICH
          # 4.2.1 links no libpmix and speaks the PMI-1 its hydra serves.
          # test/README.md "Linux" has the measurement.
          #
          # Both arches, because the two are not the same test: aarch64 is
          # where CODE.md #11's Linux rows were originally measured (Docker
          # Desktop on the development laptop) and x86_64 is what GitHub's
          # default runners are, and they differ in compiler, libc build and
          # seccomp profile.
          - mpi: mpich
            image: debian:13
            os: ubuntu-24.04
            arch: x86_64
          - mpi: mpich
            image: debian:13
            os: ubuntu-24.04-arm
            arch: aarch64
          # Open MPI stays on Ubuntu 24.04 for what its 4.1.6 covers and
          # nothing else does: that release provides 466 of the ABI's 688 entry
          # points, so it is where decision 6's MPI_ERR_UNSUPPORTED_OPERATION
          # paths are exercised most broadly. The suite rows no longer share this
          # pin -- they build Open MPI 5.0.10 from source -- so moving this image
          # now costs only what this row measures, where before it would have
          # invalidated a 168-line expected-failure list.
          - mpi: openmpi
            image: ubuntu:24.04
            os: ubuntu-24.04
            arch: x86_64
          - mpi: openmpi
            image: ubuntu:24.04
            os: ubuntu-24.04-arm
            arch: aarch64
    steps:
      # Before checkout, deliberately. The base images carry no git, which
      # sends actions/checkout down its REST-tarball fallback -- it works, and
      # leaves no .git at all.
      - name: Install git for actions/checkout
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends git ca-certificates

      - uses: actions/checkout@v6

      - name: Build and test
        run: bash ci-scripts/linux-test.sh ${{ matrix.mpi }}

  # ------------------------------- pinned tarballs, cached, + consumption
  # NOTES.md #9's version table: MPICH >= 4.0 is the only implementation that
  # provides the ABI's `_c` large-count surface, and Open MPI >= 5.0 is
  # sessions plus the current component architecture -- which nothing else in
  # this workflow covers, the distro row above being 4.1.6. Both versions are
  # the installers' own defaults, restated here so they are visible and can
  # enter the cache key.
  linux-source:
    name: linux / ${{ matrix.mpi }} ${{ matrix.version }} / ${{ matrix.arch }} (from source)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - mpi: mpich
            version: 5.0.1
            os: ubuntu-24.04
            arch: x86_64
          - mpi: mpich
            version: 5.0.1
            os: ubuntu-24.04-arm
            arch: aarch64
          - mpi: openmpi
            version: 5.0.10
            os: ubuntu-24.04
            arch: x86_64
          - mpi: openmpi
            version: 5.0.10
            os: ubuntu-24.04-arm
            arch: aarch64
    steps:
      - uses: actions/checkout@v6

      # gfortran is required, not incidental. NOTES.md #9 forbids
      # --disable-fortran: it silently drops the *implementations* of
      # MPI_Type_create_f90_{real,complex,integer}, which are plain C entry
      # points MPI-5.0 requires, so the compile-only probe reports them
      # available and only the wrapper's link step fails. The installers run a
      # stock configure, which needs a Fortran compiler present.
      #
      # This job is not root, so linux-test.sh's own apt block is skipped and
      # this step is what provisions the runner. pkg-config is here so
      # check-install.sh's pkg-config leg runs rather than self-skipping.
      - name: Install the toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
              build-essential gfortran cmake python3 patch binutils \
              poppler-utils curl ca-certificates pkg-config

      # runner.temp is usable in a step's with:/env: but not in a job's env:
      # block, hence a step. The prefix carries the implementation name so the
      # two legs never collide -- mpicc, the RPATHs and the install names all
      # bake absolute paths in -- and so a later cross-test row could restore
      # both onto one runner. MPI_SRC_DIR is set for re-runs and diagnostics,
      # not for caching; see below.
      - name: Set up paths
        run: |
          {
              echo "PREFIX=${RUNNER_TEMP}/opt/mpi-${{ matrix.mpi }}"
              echo "MPI_SRC_DIR=${RUNNER_TEMP}/mpi-src-${{ matrix.mpi }}"
          } >>"${GITHUB_ENV}"

      # The key hashes **the install scripts**, which is what
      # ci-scripts/README.md and CODE.md #3 actually say, and what determines
      # the bytes in the prefix: install-mpich.sh and install-openmpi.sh are the
      # only files that build one. It was `ci-scripts/**` minus the suite, which
      # honoured the letter of the rule and was broader than its reason -- every
      # edit to linux-test.sh or check-install.sh, neither of which can change a
      # single byte of an installed MPI, rebuilt four of them.
      #
      # A glob rather than the two names: a third installer added later joins
      # the key by existing, where a list of names would silently serve an MPI
      # built without it.
      #
      # The suite is excluded by construction now rather than by a negation.
      # Keep it that way: `ci-scripts/*` would NOT have worked, because
      # @actions/glob expands a matched directory to all of its descendants. The
      # cache step prints the key it used, so a commit that changes only a
      # reason in ci-scripts/suite/ and moves that hash means this is wrong.
      #
      # The version is in the key because it is a matrix value rather than a
      # file: the installer's own default is hashed, but the argument passed
      # here is not, so without it a version bump would restore the previous
      # MPI under an unchanged hash.
      #
      # `mpi1-` is a manual epoch: actions/cache restores an archive to the
      # absolute paths recorded at save time, so renaming the prefix means
      # bumping this or a stale cache restores to the old path and reads as a
      # broken installation rather than a stale cache.
      - name: Restore the MPI installation
        id: cache-mpi
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/opt/mpi-${{ matrix.mpi }}
          key: mpi1-${{ matrix.mpi }}-${{ matrix.version }}-${{ matrix.os }}-${{ runner.arch }}-${{ hashFiles('ci-scripts/install-*.sh') }}

      - name: Build and install ${{ matrix.mpi }} ${{ matrix.version }}
        if: steps.cache-mpi.outputs.cache-hit != 'true'
        run: ci-scripts/install-${{ matrix.mpi }}.sh "${PREFIX}" "${{ matrix.version }}"

      # Saved here rather than through plain actions/cache, whose post step is
      # post-if: success() -- a test failure below would otherwise discard an
      # MPI that had just taken twenty minutes to build. The predicate is then
      # exactly "the MPI installed", which is what it should be.
      #
      # The unpacked source tree is deliberately not cached: it is a couple of
      # hundred megabytes to save a twenty-second download, and it competes for
      # the repository's cache budget with the prefixes that matter.
      - name: Save the MPI installation
        if: steps.cache-mpi.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/opt/mpi-${{ matrix.mpi }}
          key: ${{ steps.cache-mpi.outputs.cache-primary-key }}

      # The gate that keeps an environment failure from being reported as a
      # wrapper failure. MPICH's ch4:ofi and Open MPI's prte each choose a
      # network interface on their own, and test/README.md records at length
      # what happens when the one they choose does not work. If this step
      # fails, the answer is to name the interface in this file with a comment
      # -- never to set -DMPI_ABI_TEST_USE_LAUNCHER=OFF, which would put
      # MPI_ABI_EXPECT_RANKS=1 into every test's environment and let the row
      # pass green having never crossed a rank boundary (HISTORY.md #2.14).
      - name: Two ranks, with no wrapper involved
        run: |
          cat >"${RUNNER_TEMP}/hello.c" <<'EOF'
          #include <mpi.h>
          #include <stdio.h>
          int main(int argc, char **argv) {
              int size = -1, rank = -1;
              MPI_Init(&argc, &argv);
              MPI_Comm_size(MPI_COMM_WORLD, &size);
              MPI_Comm_rank(MPI_COMM_WORLD, &rank);
              printf("rank %d of %d\n", rank, size);
              MPI_Finalize();
              return size == 2 ? 0 : 1;
          }
          EOF
          "${PREFIX}/bin/mpicc" -o "${RUNNER_TEMP}/hello" "${RUNNER_TEMP}/hello.c"
          if ! "${PREFIX}/bin/mpiexec" -n 2 "${RUNNER_TEMP}/hello"; then
              echo "::error::${{ matrix.mpi }} ${{ matrix.version }} cannot launch two ranks on this runner; ctest below would have blamed the wrapper"
              exit 1
          fi

      # The path arm of linux-test.sh is exactly what its header documents for
      # "an MPI built from a pinned tarball, which is how NOTES.md #9 wants CI
      # to provision them", and reusing it keeps the gating/informational
      # split, the symbol-binding report and the dlmopen probe in one place.
      #
      # One thing it does not cover: the script exports
      # OMPI_MCA_btl_vader_single_copy_mechanism=none, which is the Open MPI
      # 4.x spelling and a no-op on 5.0.10. If the 5.0.10 leg ever shows
      # single-copy errors, the variable to add here is OMPI_MCA_smsc=^cma.
      - name: Build and test
        run: ci-scripts/linux-test.sh "${PREFIX}/bin/mpicc"

      # NOTES.md #9 decision 19. Installs this project into a prefix of its own
      # and builds *and runs* a program through bin/mpicc,
      # find_package(mpi_abi), the FindMPI shim and pkg-config, with
      # LD_LIBRARY_PATH/DYLD_LIBRARY_PATH cleared, checking that libmpi_abi is
      # each binary's only MPI dependency. This is also the only place the
      # Linux RPATH story is tested: on macOS the absolute install names make
      # every route pass for free.
      - name: Check the installed prefix's consumption routes
        run: ci-scripts/check-install.sh "${PREFIX}/bin/mpicc"

      # linux-test.sh tails 25 lines of its own configure log; FindMPI
      # suppresses its probes' compile and link output, which is the part that
      # says why.
      - name: Show CMake's check logs
        if: failure()
        run: |
          for log in /tmp/cmake-mpi-${{ matrix.mpi }}.log \
                     /tmp/build-mpi-${{ matrix.mpi }}/CMakeFiles/CMakeConfigureLog.yaml \
                     /tmp/build-mpi-${{ matrix.mpi }}/CMakeFiles/CMakeError.log; do
              if [[ -f ${log} ]]; then
                  echo "::group::${log}"; cat "${log}"; echo "::endgroup::"
              fi
          done

  # ------------------------------------------------------------------ i386
  # The 32-bit row, and the only one where an ABI handle is not 64 bits.
  # NOTES.md #4.1: handles are *pointer-sized*, so ILP32 is the one place the
  # "no spare high bits to tag with" constraint is visible, and #5.1's
  # dynamic-handle collision probe in mpiwrapper_selftest is a real test here
  # rather than a formality.
  #
  # A matrix row cannot express this -- it is a different architecture of the
  # same kernel, not a different runner -- so the image build *is* the test:
  # every step of docker/mpich-i386.dockerfile is a RUN, and a successful build
  # is a passed run. Nothing is pushed or loaded.
  linux-i386:
    name: linux / mpich / i386 (debian:13)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      # For the GitHub Actions cache backend below, which the default `docker`
      # driver does not support.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # The layer worth reusing is the apt install, which is why mode=max: the
      # final image is thrown away. The dockerfile is ordered for it, packages
      # before the source copy, so an ordinary source edit reuses that layer.
      - name: Build and test in a linux/386 container
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/mpich-i386.dockerfile
          platforms: linux/386
          push: false
          cache-from: type=gha,scope=mpich-i386
          cache-to: type=gha,mode=max,scope=mpich-i386

  # ------------------------------------------------- third-party compilers
  # TODO.md's "test with Intel and Nvidia compilers". Compile, do not run: the
  # question these answer is whether the *generated* code is portable across
  # compilers, and that is settled at build time. Running would drag in Ubuntu's
  # MPICH launcher, which cannot start two ranks (see the distro rows), and
  # answer a question nobody asked here.
  #
  # The wrapper is built, not just libmpi_abi. -DMPI_ABI_BUILD_WRAPPER=OFF would
  # be the easy row -- no MPI needed -- and close to worthless for this purpose:
  # it compiles bootstrap.c and one generated file, while the whole conversion
  # layer, the 1366 slots and every hand-written body sit on the other side of
  # that switch. Those are what a third compiler has an opinion about.
  #
  # -Werror is on for every target here, so any diagnostic these compilers have
  # that gcc and clang do not is a failure. That is the point of the row.
  #
  # **It gates.** It started report-only, on the rule that a row nobody has ever
  # seen green cannot tell a regression from the thing it was added to find, and
  # it went green once nvc's four objections were dealt with -- two in the
  # availability probe, one in the warning flags, and the int/enum conversions
  # of HISTORY.md #3's S6b. Everything it now reports is a change since then.
  compile:
    name: compile / ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        name: [icx, nvc]
    steps:
      - uses: actions/checkout@v6

      - name: Install the build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
              build-essential gfortran cmake python3 patch binutils curl \
              ca-certificates

      - name: Set up paths
        run: |
          {
              echo "PREFIX=${RUNNER_TEMP}/opt/mpi-mpich"
              echo "MPI_SRC_DIR=${RUNNER_TEMP}/mpi-src-mpich"
          } >>"${GITHUB_ENV}"

      # The *pinned* MPICH rather than the distro's, and not for the version.
      # Debian and Ubuntu build their mpicc wrapper to pass the distro's own
      # hardening and LTO flags, and FindMPI interrogates that wrapper and then
      # compiles a probe with them -- so with nvc the configure died on
      #
      #   nvc-Error-Unknown switch: -flto=auto
      #   nvc-Error-Unknown switch: -ffat-lto-objects
      #
      # before a line of this project was compiled. That is a property of a
      # packaging choice meeting a third compiler, not something a row about our
      # portability should be reporting. install-mpich.sh runs a stock
      # configure, so its wrapper names only what MPICH itself needs. icx
      # swallowed the distro flags happily, which is exactly why the row that
      # did not is the informative one.
      #
      # Restore-only, sharing the key the linux-source rows save under: this job
      # never writes that cache, so the two cannot race over it. A miss simply
      # builds, which costs this row alone.
      - name: Restore the MPI installation
        id: cache-mpi
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/opt/mpi-mpich
          key: mpi1-mpich-5.0.1-ubuntu-24.04-${{ runner.arch }}-${{ hashFiles('ci-scripts/install-*.sh') }}

      - name: Build and install MPICH 5.0.1
        if: steps.cache-mpi.outputs.cache-hit != 'true'
        run: ci-scripts/install-mpich.sh "${PREFIX}" 5.0.1

      # Intel's oneAPI compilers come from Intel's own apt repository, and the
      # environment they need comes from setvars.sh rather than from PATH alone.
      - name: Install the Intel oneAPI compilers
        if: matrix.name == 'icx'
        run: |
          curl -fsSL https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB \
              | sudo gpg --dearmor -o /usr/share/keyrings/oneapi-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/oneapi-archive-keyring.gpg] https://apt.repos.intel.com/oneapi all main" \
              | sudo tee /etc/apt/sources.list.d/oneAPI.list
          sudo apt-get update
          sudo apt-get install -y intel-oneapi-compiler-dpcpp-cpp
          set +u
          source /opt/intel/oneapi/setvars.sh
          set -u
          {
              echo "CC=icx"
              echo "PATH=${PATH}"
              echo "LD_LIBRARY_PATH=${LD_LIBRARY_PATH:-}"
          } >>"${GITHUB_ENV}"

      # Several GB, so the runner's preinstalled toolchains go first. The
      # package name carries the release, which would rot if written down, so
      # the newest the repository offers is what gets installed and the step
      # prints which that was.
      - name: Install the NVIDIA HPC SDK
        if: matrix.name == 'nvc'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          curl -fsSL https://developer.download.nvidia.com/hpc-sdk/ubuntu/DEB-GPG-KEY-NVIDIA-HPC-SDK \
              | sudo gpg --dearmor -o /usr/share/keyrings/nvidia-hpcsdk-archive-keyring.gpg
          echo 'deb [signed-by=/usr/share/keyrings/nvidia-hpcsdk-archive-keyring.gpg] https://developer.download.nvidia.com/hpc-sdk/ubuntu/amd64 /' \
              | sudo tee /etc/apt/sources.list.d/nvhpc.list
          sudo apt-get update
          package=$(apt-cache search --names-only '^nvhpc-[0-9]+-[0-9]+$' \
              | cut -d' ' -f1 | sort -V | tail -1)
          echo "installing ${package}"
          sudo apt-get install -y "${package}"
          bindir=$(dirname "$(find /opt/nvidia/hpc_sdk -name nvc -type f \
              -path '*/compilers/bin/*' | sort -V | tail -1)")
          echo "CC=${bindir}/nvc" >>"${GITHUB_ENV}"

      # CMAKE_C_COMPILER is what compiles; MPI_C_COMPILER is only interrogated
      # by FindMPI for the flags. The two are deliberately different here --
      # MPICH's wrapper names gcc, and what is under test is the compiler.
      - name: Configure and build with ${{ matrix.name }}
        run: |
          "${CC}" --version | head -3
          cmake -S . -B build \
              -DCMAKE_C_COMPILER="${CC}" \
              -DMPI_C_COMPILER="${PREFIX}/bin/mpicc"
          cmake --build build -j"$(nproc)"

      - name: Show CMake's check logs
        if: failure()
        run: |
          for log in build/CMakeFiles/CMakeConfigureLog.yaml \
                     build/CMakeFiles/CMakeError.log; do
              if [[ -f ${log} ]]; then
                  echo "::group::${log}"; cat "${log}"; echo "::endgroup::"
              fi
          done

  # ------------------------------------------------------------ sanitizers
  # NOTES.md #11's S9. Runs in the debian:13 container for the same reason the
  # MPICH row above does -- Ubuntu's MPICH answers `-n 2` with two singletons --
  # and inline rather than through linux-test.sh, which takes no cmake flags.
  #
  # This job is also the measurement #12 asks for and does not have: "whether
  # RTLD_DEEPBIND survives ASan, which is the case it is most likely to disturb.
  # **Measure before assuming**." The wrapper is dlopen'd with RTLD_DEEPBIND
  # under an ASan-instrumented process here, so a green run is that answer and a
  # red one is the finding.
  sanitize:
    name: sanitize / ${{ matrix.sanitize }} / mpich
    runs-on: ubuntu-24.04
    container: debian:13
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # Quoted, and one leg. Unquoted `[address,undefined]` is a YAML flow
        # sequence of *two* items, which would silently build ASan and UBSan
        # separately rather than the combined set S9 asks for. A matrix of one
        # so that `thread` -- S9's other half, the MPI_THREAD_MULTIPLE stress --
        # is a line rather than a restructure.
        sanitize: ["address,undefined"]
    env:
      # LeakSanitizer is on by default under Linux, and what it would report
      # first is the wrapped MPI's own allocations surviving MPI_Finalize --
      # this job being an instrumented process standing next to an
      # uninstrumented library, which #12 predicts is "mostly triage of noise
      # that has nothing to do with this code". test/lsan.supp carries the
      # by-design leaks that are ours; the implementation's share is the triage
      # nobody has done, so leak detection is off rather than pretending the
      # file is complete. Turning it on is one word here plus that work.
      ASAN_OPTIONS: detect_leaks=0
      LSAN_OPTIONS: suppressions=test/lsan.supp
      # UBSan *warns and continues* by default, which would make this row green
      # while printing its findings into a log nobody reads.
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - name: Install git for actions/checkout
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends git ca-certificates

      - uses: actions/checkout@v6

      - name: Install packages
        run: |
          apt-get install -y -qq --no-install-recommends \
              build-essential cmake python3 patch binutils poppler-utils \
              libmpich-dev mpich

      - name: Configure and build with -fsanitize=${{ matrix.sanitize }}
        run: |
          cmake -S . -B build \
              -DMPI_C_COMPILER="$(command -v mpicc.mpich || command -v mpicc)" \
              -DMPI_ABI_SANITIZE=${{ matrix.sanitize }}
          cmake --build build -j"$(nproc)"

      # **ASan and RTLD_DEEPBIND are incompatible**, and this row is what
      # established it. NOTES.md #12 asked for exactly this measurement --
      # "whether RTLD_DEEPBIND survives ASan, which is the case it is most
      # likely to disturb. Measure before assuming" -- and the answer, from the
      # first run, is that the sanitizer runtime refuses the load outright:
      #
      #   You are trying to dlopen ... with RTLD_DEEPBIND flag which is
      #   incompatible with sanitizer runtime (google/sanitizers#611)
      #
      # So the five tests that load a wrapper cannot run here, on any MPI, and
      # no flag of ours changes that. #11's S9 lists three ways forward and this
      # is the third: "accept that the sanitizer jobs cover libmpi_abi and the
      # conversion layer rather than the loaded configuration." What is left is
      # not thin -- mpiwrapper_selftest compiles the whole conversion runtime
      # into itself precisely so it can be exercised without a dlopen, and it is
      # the test that walks the handle maps in both directions.
      #
      # isolation-check is excluded for a subtler reason: it treats a refused
      # load as a pass, so under ASan it would pass for the wrong cause and
      # report nothing about isolation.
      #
      # The exclusion is by name and will therefore fail loudly if a test is
      # renamed, rather than silently covering less.
      - name: Test what a sanitizer can reach
        run: |
          ctest --test-dir build --output-on-failure --no-tests=error \
              --timeout 600 -E '^abi_|^isolation-check$'

  # ----------------------------------------------------------------- macOS
  # Required by NOTES.md #1's portability constraint and not redundant with
  # Linux: macOS is where the two-level namespace does the isolation (#2),
  # where isolation-check builds a second -flat_namespace wrapper to prove the
  # check fires, and where bin/mpicc's -isysroot handling is exercised.
  #
  # linux-test.sh is not usable here -- nproc, `nm -D` and .so globs -- so this
  # leg spells out the same commands. scripts/host-env.sh must NOT be called:
  # it is one laptop's firewall and VPN configuration.
  macos:
    name: macos / ${{ matrix.mpi }}
    runs-on: macos-15
    timeout-minutes: 45
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
      HOMEBREW_NO_ENV_HINTS: 1
    strategy:
      fail-fast: false
      matrix:
        include:
          # One implementation per leg: the two formulae conflict.
          - mpi: mpich
            formula: mpich
          - mpi: openmpi
            formula: open-mpi
    steps:
      - uses: actions/checkout@v6

      # poppler is pdftotext, for the c-bindings cross-check; pkgconf makes
      # check-install.sh's pkg-config route real rather than skipped with a
      # reason. cmake and python3 come with the runner image.
      - name: Install ${{ matrix.formula }}
        run: brew install ${{ matrix.formula }} poppler pkgconf

      # The keg's own bin, never the shared $(brew --prefix)/bin, and never a
      # hard-coded /opt/homebrew. CMakeLists.txt takes mpiexec from *beside*
      # MPI_C_COMPILER with NO_DEFAULT_PATH, so that one implementation's
      # binaries are never launched under another's hydra -- and Homebrew puts
      # every formula's wrappers in one shared bindir, which defeats exactly
      # that. A keg's bin holds one implementation and nothing else.
      - name: Set up paths
        run: echo "MPI_BINDIR=$(brew --prefix ${{ matrix.formula }})/bin" >>"${GITHUB_ENV}"

      # The same gate as the Linux from-source rows, and here it is
      # load-bearing: test/README.md records Open MPI 5.0.x failing to launch
      # on the developer's laptop, which HISTORY.md #2.13 traced to that
      # machine's application firewall blocking prte rather than to Open MPI.
      # GitHub's macOS images ship the firewall off, so this should pass; if it
      # does not, that is a finding to investigate, not a flag to set.
      - name: Two ranks, with no wrapper involved
        run: |
          cat >"${RUNNER_TEMP}/hello.c" <<'EOF'
          #include <mpi.h>
          #include <stdio.h>
          int main(int argc, char **argv) {
              int size = -1, rank = -1;
              MPI_Init(&argc, &argv);
              MPI_Comm_size(MPI_COMM_WORLD, &size);
              MPI_Comm_rank(MPI_COMM_WORLD, &rank);
              printf("rank %d of %d\n", rank, size);
              MPI_Finalize();
              return size == 2 ? 0 : 1;
          }
          EOF
          "${MPI_BINDIR}/mpicc" -o "${RUNNER_TEMP}/hello" "${RUNNER_TEMP}/hello.c"
          if ! "${MPI_BINDIR}/mpiexec" -n 2 "${RUNNER_TEMP}/hello"; then
              echo "::error::${{ matrix.formula }} cannot launch two ranks on this runner"
              exit 1
          fi

      - name: Configure
        run: cmake -S . -B build -DMPI_C_COMPILER="${MPI_BINDIR}/mpicc"

      - name: Build
        run: cmake --build build -j"$(getconf _NPROCESSORS_ONLN)"

      # No -DMPI_ABI_TEST_USE_LAUNCHER=OFF: see the gate above. --timeout is
      # not decoration either -- test/README.md documents MPI_Comm_spawn
      # hanging under hydra on macOS, and ctest's own default is 1500 s.
      - name: Test
        run: ctest --test-dir build --output-on-failure --no-tests=error --timeout 300

      - name: Check the installed prefix's consumption routes
        run: ci-scripts/check-install.sh "${MPI_BINDIR}/mpicc"

      - name: Show CMake's check logs
        if: failure()
        run: |
          for log in build/CMakeFiles/CMakeConfigureLog.yaml \
                     build/CMakeFiles/CMakeError.log; do
              if [[ -f ${log} ]]; then
                  echo "::group::${log}"; cat "${log}"; echo "::endgroup::"
              fi
          done

  # ------------------------------------------------- MPICH's C test suite
  # NOTES.md #10's behavioural oracle that nothing in this repository wrote:
  # some 900 programs that know only the MPI standard, compiled with the
  # wrapper's mpicc and linked against libmpi_abi, exactly as HDF5 or PETSc will
  # be in #11's S8. It found three conversion bugs no in-house check could have
  # seen (HISTORY.md #3, S7), and its gate reads the expected-failure list in
  # both directions -- an unlisted failure fails, a listed failure that *passed*
  # fails, a listed test that did not run fails, and a line with no reason fails.
  #
  # ci-scripts/suite/ holds the whole recipe and every list; these jobs provide
  # an MPI, a runner, and somewhere to keep the TAP file.
  #
  # **Five environments, and each has its own expected-failure list.** Three runs
  # of the previous arrangement established that one list per implementation
  # cannot describe two machines: on a four-vCPU runner every test asking for
  # more ranks than there are cores runs 5-7x slower while everything at four
  # ranks or fewer runs 5-25x *faster*, so timing expectations move in both
  # directions at once, and over Open MPI the x86_64 runner produced wrong 8-bit
  # reduction results that an aarch64 run of the same list never saw. So each row
  # gates against a shared per-implementation list plus a per-architecture delta,
  # which check-tap.py reads as one file and which keeps 40-odd reasons from
  # being copied five times. The laptop's own lists (xfail-mpich.txt,
  # xfail-openmpi.txt) stay where they are and describe that machine.
  #
  # **The MPIs are the current releases, built from source, and the two are not
  # symmetric.** MPICH 5.0.1 is the first release that is a complete MPI-5.0 --
  # its header says MPI_VERSION 5 / MPI_SUBVERSION 0 -- so it provides the ABI's
  # whole surface including the `_c` large-count forms, and decision 6's stubs
  # have almost nothing left to cover. Open MPI 5.0.10 still declares
  # MPI_VERSION 3 / MPI_SUBVERSION 1 and still has no `_c` entry point at all, so
  # that half of the ABI is stubs answering MPI_ERR_UNSUPPORTED_OPERATION on its
  # rows. Both facts were read out of the releases' own headers, not assumed.
  #
  # MPICH 5.0.1 can implement the standard ABI itself, and these rows
  # deliberately do not ask it to: its CHANGES puts that behind --enable-mpi-abi
  # and a separate mpicc_abi, with the plain mpicc still MPICH's own ABI.
  # Wrapping a library that already exports the ABI is #10's *fifth* oracle,
  # which refuses at load on macOS by design; ci-scripts/install-mpich.sh says
  # so where the flag would go.
  #
  # **What was taken from mpif's CI, and what was not.** ccache around the MPI
  # build, and checking an installation that came from a cache rather than
  # trusting it -- both of its ideas, both adopted below. Its prefix-as-artifact
  # pattern was *not*: there it pays because several downstream jobs share one
  # installed MPI, and here each prefix has exactly one consumer, so a build job
  # plus a 200 MB artifact round trip would buy nothing that restoring the cache
  # directly does not.
  #
  # **All five rows are report-only until they have been green**, the rule the
  # compile job above records. Every list is empty as this lands, which is a
  # statement that nothing has been triaged for these five environments rather
  # than a claim that the runs are clean: the version jump invalidated both older
  # lists, since MPICH 5.0.1 answers `init/version` correctly and fills in the
  # entry points that the old lists' largest group was about. The first runs are
  # what the lists get written from, and each row keeps its TAP file and logs as
  # an artifact for exactly that.
  suite:
    name: suite / ${{ matrix.leg.mpi }} ${{ matrix.leg.version }} / ${{ matrix.leg.arch }} / ${{ matrix.shard.name }}
    runs-on: ${{ matrix.leg.os }}
    # **Per leg, because the two implementations are at different stages.** The
    # MPICH legs gate: run 32155423441 produced 842 tests, 789 passed and 41
    # failed on both architectures, the 41 identical test for test, and
    # xfail-ci-mpich.txt matches them exactly in both directions -- so the rule
    # the compile job records is satisfied and TODO.md's "do not ignore mpich
    # failures" is what this implements. The Open MPI legs stay report-only:
    # their lists are still empty because no Open MPI leg has yet run to
    # completion here.
    continue-on-error: ${{ matrix.leg.report_only }}
    # A shard is a quarter of the suite plus the fixed cost every job pays: the
    # MPI restore, the wrapper build and the suite's own configure. Well under
    # the ceiling described above, and far enough under that a slow shard is
    # visible as a slow shard rather than as a dead runner.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      # **Two dimensions, crossed: the environment and the slice of the suite.**
      # Sharding is not for parallelism, it is what makes three of these legs
      # finishable at all -- ci-scripts/suite/README.md has the table of a run
      # where everything past about 45 minutes was killed mid-suite with a runner
      # shutdown signal. The slices come from measured per-directory cost rather
      # than from dividing the alphabet:
      #
      #                        MPICH 5.0.1   Open MPI (4.1.6, the shape)
      #   coll                    9.8 min       4.6 min
      #   rma                     3.8 min      37.1 min
      #   threads+pt2pt+part     11.8 min      19.3 min
      #   everything else         0.6 min      16.6 min
      #
      # rma is alone because on Open MPI it is half the suite by time -- one
      # directory bigger than the whole budget -- and isolating it is what makes
      # the other three safe rather than what makes rma safe. If the rma shard is
      # still killed, that is now a fact about one directory instead of about the
      # row, which is progress a single job could not produce.
      #
      # **And it was still killed, which is why `exclude` below drops it from the
      # two Open MPI legs.** Not as a triage of an unexplained failure: the cause
      # is measured and upstream. Open MPI 5.0 removed the `osc/pt2pt` one-sided
      # component, and `osc/rdma`, which replaces it, appears to build per-element
      # state for a derived datatype where pt2pt packed and streamed it. So the
      # cost tracks a datatype's *element count* rather than its byte count, and
      # `rma/transpose1` -- a 3.8 MB `MPI_Put` onto a million discontiguous
      # elements -- takes at least 14.6 GB and a 16 GB runner with it. Open MPI
      # 4.1.8 completes the same test with the same wrapper in 1.7 GB.
      #
      # Three things were tried and none of them reach it, each measured rather
      # than reasoned: `--mca btl self,sm`, a libfabric build that really did
      # produce an accelerated `btl/ofi` in one-sided mode, and excluding the
      # offending test lines -- which only moved the death to the next casualty,
      # because the casualties are selected by datatype shape and no testlist line
      # shows that. ci-scripts/suite/README.md has all three rounds and the run ids.
      #
      # So this drops coverage rather than pretending to have it, and the shard
      # stays in the matrix for the MPICH legs, which run the same tests green. The
      # thing to watch for is an Open MPI release that restores a streaming
      # one-sided path; re-adding two lines here is the whole of the revert.
      matrix:
        leg:
          - mpi: mpich
            version: 5.0.1
            os: ubuntu-24.04
            arch: x86_64
            launcher: hydra
            timeout_multiplier: 2
            report_only: false
            exclude_args: ""
          - mpi: mpich
            version: 5.0.1
            os: ubuntu-24.04-arm
            arch: aarch64
            launcher: hydra
            timeout_multiplier: 2
            report_only: false
            exclude_args: ""
          - mpi: openmpi
            version: 5.0.10
            os: ubuntu-24.04
            arch: x86_64
            launcher: prte
            timeout_multiplier: 1
            report_only: true
            # **Currently inert, and kept deliberately.** Every pattern in
            # exclude-ci-openmpi.txt names a test in `rma`, and `rma` is excluded
            # from these legs by the matrix above, so nothing matches today. It
            # stays wired because the two are independent decisions: if a future
            # Open MPI makes the directory affordable again, re-adding the shard
            # restores these two line exclusions with it rather than silently
            # running the two tests that are known to take a runner down.
            exclude_args: "--exclude=exclude-ci-openmpi.txt"
          - mpi: openmpi
            version: 5.0.10
            os: ubuntu-24.04-arm
            arch: aarch64
            launcher: prte
            timeout_multiplier: 1
            report_only: true
            # **Currently inert, and kept deliberately.** Every pattern in
            # exclude-ci-openmpi.txt names a test in `rma`, and `rma` is excluded
            # from these legs by the matrix above, so nothing matches today. It
            # stays wired because the two are independent decisions: if a future
            # Open MPI makes the directory affordable again, re-adding the shard
            # restores these two line exclusions with it rather than silently
            # running the two tests that are known to take a runner down.
            exclude_args: "--exclude=exclude-ci-openmpi.txt"
        # The last shard is the *complement* of the other three rather than a
        # fourth list, so a directory a later suite release adds is covered by
        # construction instead of by somebody remembering to add it here.
        shard:
          - name: coll
            args: "--dirs=coll"
          - name: rma
            args: "--dirs=rma"
          - name: p2p
            args: "--dirs=threads,pt2pt,part"
          - name: rest
            args: "--skip-dirs=coll,rma,threads,pt2pt,part"
        # **Drop rma from the Open MPI legs.**
        #
        # **Spelled out in full on purpose, and the shorter form was tested rather
        # than assumed.** `leg: {mpi: openmpi}` alone *is* a valid workflow -- pushed
        # and checked on this branch -- and `exclude` does document partial matching.
        # What is not established is whether that partial match reaches *inside* an
        # object value, and the cost of being wrong is asymmetric: an exclude that
        # fails to match runs the rma shard, which kills a runner. An exact match on
        # the whole object cannot be wrong about that. (The run that failed while this
        # was being worked out, 32301380331, was neither form: an unbounded edit had
        # put a `leg` exclude into the suite-i386 matrix, which has no `leg`.)
        #
        # **So these two objects are duplicates and have to stay in step with the
        # legs above.** If a leg gains or changes a field and its copy here does not,
        # this entry stops matching and the rma shard comes back. That is visible
        # rather than silent -- the shard dies and the job fails -- but it is still a
        # trap, so: edit a leg, edit its copy.
        #
        # Two combinations go, leaving 14 suite jobs where there were 16: coll, p2p
        # and rest on all four legs, rma on the two MPICH legs only. An excluded
        # combination is never created, so this costs no runner -- which is the
        # point. A step-level `if:` would have skipped the work and still paid for
        # the checkout, the MPI restore and the wrapper build, and a job-level `if:`
        # cannot see `matrix` at all.
        exclude:
          - leg:
              mpi: openmpi
              version: 5.0.10
              os: ubuntu-24.04
              arch: x86_64
              launcher: prte
              timeout_multiplier: 1
              report_only: true
              exclude_args: "--exclude=exclude-ci-openmpi.txt"
            shard:
              name: rma
              args: "--dirs=rma"
          - leg:
              mpi: openmpi
              version: 5.0.10
              os: ubuntu-24.04-arm
              arch: aarch64
              launcher: prte
              timeout_multiplier: 1
              report_only: true
              exclude_args: "--exclude=exclude-ci-openmpi.txt"
            shard:
              name: rma
              args: "--dirs=rma"
    env:
      # The matrix context is available in a job's env: block where the runner
      # context is not, which is why the paths below are a step and this is not.
      MPITEST_TIMEOUT_MULTIPLIER: ${{ matrix.leg.timeout_multiplier }}
      # Stated rather than left to run-suite.sh's inspection of `mpiexec
      # --version`, because this row knows and the failure mode is quiet: `prte`
      # is what makes mpiexec-filter pass --oversubscribe, and without it Open
      # MPI refuses to start any test asking for more ranks than the runner has
      # cores -- a whole category of the suite failing to launch, on a row that
      # takes 75 minutes to tell you. Open MPI 4.1.8 answers "mpiexec (OpenRTE)
      # 4.1.8", which is the spelling that made this worth pinning down.
      MPIEXEC_FILTER_KIND: ${{ matrix.leg.launcher }}
    steps:
      - uses: actions/checkout@v6

      # The linux-source set, minus poppler-utils because this job installs the
      # wrapper rather than running ctest over it, plus perl -- which is what
      # runtests is written in, named rather than assumed even though the runner
      # image carries it -- and ccache, for the build below. gfortran is not
      # incidental: NOTES.md #9 forbids --disable-fortran, which silently drops
      # the *implementations* of MPI_Type_create_f90_{real,complex,integer},
      # plain C entry points MPI-5.0 requires, so the compile-only probe reports
      # them available and only the wrapper's link fails.
      - name: Install the toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
              build-essential gfortran cmake python3 patch binutils \
              curl ca-certificates perl ccache

      # Everything writable is under RUNNER_TEMP rather than in the checkout:
      # run-suite.sh's own defaults put the wrapper prefix, the suite build and
      # the tarball under build/, and the collect step below wants one path that
      # does not move. runner.temp is not available in a job's env: block, hence
      # a step.
      - name: Set up paths
        run: |
          {
              echo "PREFIX=${RUNNER_TEMP}/opt/mpi-${{ matrix.leg.mpi }}"
              echo "MPI_SRC_DIR=${RUNNER_TEMP}/mpi-src-${{ matrix.leg.mpi }}"
              echo "MPIABI_SUITE_WORK=${RUNNER_TEMP}/suite-work"
              echo "MPIABI_SUITE_SRC=${RUNNER_TEMP}/suite-src"
              echo "CCACHE_DIR=${RUNNER_TEMP}/ccache"
          } >>"${GITHUB_ENV}"

      # The same key the linux-source rows save under, so a warm cache serves
      # both: restore-only here, exactly as the compile job does, so the two
      # cannot race over it. A miss simply builds, at the cost of this row alone.
      - name: Restore the MPI installation
        id: cache-mpi
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/opt/mpi-${{ matrix.leg.mpi }}
          key: mpi1-${{ matrix.leg.mpi }}-${{ matrix.leg.version }}-${{ matrix.leg.os }}-${{ runner.arch }}-${{ hashFiles('ci-scripts/install-*.sh') }}

      # mpif's idea, and it earns its place on the run where the prefix cache
      # misses but the compiler cache does not -- a version bump invalidates the
      # first and leaves most of the second useful. Keyed by run_id so each run
      # writes a fresh entry, with restore-keys falling back to the newest
      # previous one, because cache entries are immutable.
      - name: Restore ccache
        id: cache-ccache
        if: steps.cache-mpi.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-suite-${{ matrix.leg.mpi }}-${{ matrix.leg.version }}-${{ matrix.leg.os }}-${{ github.run_id }}
          restore-keys: ccache-suite-${{ matrix.leg.mpi }}-${{ matrix.leg.version }}-${{ matrix.leg.os }}-

      # /usr/lib/ccache holds gcc, g++ and gfortran shims, so putting it first on
      # PATH is the whole of the wiring -- the installers run a stock configure
      # and pick the compilers up by name.
      - name: Build and install ${{ matrix.leg.mpi }} ${{ matrix.leg.version }}
        if: steps.cache-mpi.outputs.cache-hit != 'true'
        run: |
          export PATH=/usr/lib/ccache:${PATH}
          ccache --zero-stats
          ci-scripts/install-${{ matrix.leg.mpi }}.sh "${PREFIX}" "${{ matrix.leg.version }}"
          ccache --show-stats

      - name: Save ccache
        if: always() && steps.cache-mpi.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/ccache
          key: ${{ steps.cache-ccache.outputs.cache-primary-key }}

      # Runs on a cache hit as well, which is the point: a hit is exactly when
      # nothing has verified the installation, and mpif's check-mpi-install.sh
      # exists for the same reason. It also separates "this runner cannot launch
      # a job" from a suite result -- a launcher answering `-n 2` with two
      # singletons would run the whole suite at a job size nobody asked for and
      # the gate would report the difference as ours. The suite has no rank check
      # of its own; test/expect_ranks.h is in our tests, not in MPICH's.
      - name: Two ranks, with no wrapper involved
        run: |
          cat >"${RUNNER_TEMP}/hello.c" <<'EOF'
          #include <mpi.h>
          #include <stdio.h>
          int main(int argc, char **argv) {
              int size = -1, rank = -1;
              MPI_Init(&argc, &argv);
              MPI_Comm_size(MPI_COMM_WORLD, &size);
              MPI_Comm_rank(MPI_COMM_WORLD, &rank);
              printf("rank %d of %d\n", rank, size);
              MPI_Finalize();
              return size == 2 ? 0 : 1;
          }
          EOF
          "${PREFIX}/bin/mpicc" -o "${RUNNER_TEMP}/hello" "${RUNNER_TEMP}/hello.c"
          if ! "${PREFIX}/bin/mpiexec" -n 2 "${RUNNER_TEMP}/hello"; then
              echo "::error::${{ matrix.leg.mpi }} ${{ matrix.leg.version }} cannot launch two ranks on this runner; the suite below would have blamed the wrapper"
              exit 1
          fi

      # Two lists: what every architecture of this implementation sees, and the
      # delta for this one. --variant names the row in the log and picks the work
      # directory; the lists are named explicitly so the gate is readable off the
      # YAML rather than inferred from the launcher.
      #
      # FI_PROVIDER is deliberately unset: ch4:ofi choosing a bad interface is a
      # property of a host, and run-suite.sh's header says why it is left to the
      # host to set. If a row shows MPI_Finalize failing across the board,
      # FI_PROVIDER=tcp is the knob and test/README.md has the measurement.
      - name: Run the suite
        run: |
          ci-scripts/suite/run-suite.sh "${PREFIX}/bin/mpicc" \
              --variant=ci-${{ matrix.leg.mpi }}-${{ matrix.leg.arch }} \
              --xfail=xfail-ci-${{ matrix.leg.mpi }}.txt \
              --xfail=xfail-ci-${{ matrix.leg.mpi }}-${{ matrix.leg.arch }}.txt \
              --flaky=flaky-ci-${{ matrix.leg.mpi }}.txt \
              ${{ matrix.leg.exclude_args }} \
              ${{ matrix.shard.args }}

      # Staged into the workspace first, and uploaded by a **relative** path.
      # `${{ runner.temp }}` inside a `with:` block does not mean what the shell
      # means by RUNNER_TEMP once a container is involved: in run 32069590099 the
      # expression gave the host's /home/runner/work/_temp while the container's
      # shell had /__w/_temp, the literal summary.tap resolved through the mount
      # and the *.log pattern did not, and that row uploaded one file of six --
      # losing exactly the logs that attribute a failure. A relative path is
      # resolved against GITHUB_WORKSPACE by the action and by the shell alike,
      # and the copy runs where the files are.
      #
      # if: always() on both, because a *green* run's TAP file is worth as much
      # as a red one's: `run-suite.sh --gate-only` re-runs the comparison against
      # a file already in hand, which is how these five lists get written without
      # paying for five more runs. summary.xml is left out as redundant.
      - name: Collect the TAP file and the suite's logs
        if: always()
        run: |
          mkdir -p suite-artifact
          cp -f "${MPIABI_SUITE_WORK}/summary.tap" suite-artifact/ || true
          cp -f "${MPIABI_SUITE_WORK}"/*.log suite-artifact/ || true
          ls -l suite-artifact

      - name: Keep the TAP file and the suite's logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: suite-${{ matrix.leg.mpi }}-${{ matrix.leg.arch }}-${{ matrix.shard.name }}
          path: suite-artifact
          retention-days: 30

  # ------------------------------------------------------------ i386, 32-bit
  # The fifth row, and the only one where an ABI handle is 4 bytes. NOTES.md #4.1
  # makes this load-bearing rather than routine coverage: handles are
  # *pointer-sized*, so ILP32 is the one place the "no spare high bits to tag
  # with" constraint is visible and #5.1's dynamic-handle collision probe in
  # mpiwrapper_selftest is a real test rather than a formality. #4.2's status
  # layouts are also at their tightest here.
  #
  # **It cannot be a matrix leg of the job above, and the reason is the runner
  # rather than the architecture.** GitHub injects its own x86_64 node into a
  # `container:` job to execute JS actions like checkout and upload-artifact, and
  # a 32-bit userspace has no 64-bit libc to run that against, so the job fails
  # before its first step. docker/mpich-i386.dockerfile answers this by making
  # the image build *be* the test; a suite run cannot, because it has to hand a
  # TAP file back. So this row keeps the actions on the 64-bit host and puts only
  # the work inside `docker run`, through the mount contract
  # ci-scripts/run-linux-docker.sh already defines: /src read-only, /out
  # read-write, everything writable under /out.
  #
  # linux/386 is native on an x86_64 kernel, so this costs about what the 64-bit
  # rows cost and needs no qemu.
  suite-i386:
    name: suite / mpich 5.0.1 / i386 / ${{ matrix.shard.name }}
    runs-on: ubuntu-24.04
    # **This row gates, like the other MPICH rows.** It was continue-on-error while
    # its lists were being written; TODO.md's "do not ignore mpich failures" is the
    # rule, and an MPICH row that cannot fail the build is not applying it. The four
    # shards' lists are xfail-ci-mpich.txt plus the eleven ILP32 deltas in
    # xfail-ci-mpich-i386.txt, and three of the four match them.
    #
    # **The fourth does not, and turning this on makes that block rather than whisper:
    # `i386 / rest` loses its runner.** "The hosted runner lost communication with the
    # server", at 49 to 52 minutes, in five consecutive attempts of run 32302208489 and
    # in every run since, 32425661806 included. It uploads no log and no TAP, so there
    # is nothing for either list to excuse -- an xfail line needs a result and a flaky
    # line needs one too.
    #
    # **The rma work's instrument does not reach this one**, which is measured rather
    # than assumed: that method rests on a killed job keeping its log while losing its
    # artifacts, and this job keeps neither -- `gh run view --job 96606969905 --log`
    # answers "log not found" and the run's log archive has no entry for the job at
    # all. So a probe of this row has to end on its own terms. What one *cancelled*
    # run did leave behind says the shard is failing 172 tests, 139 of them with
    # SIGBUS, and that 18 of its 20 minutes are in `io` alone;
    # ci-scripts/suite/README.md's "The i386 `rest` shard" has the numbers and the
    # hypothesis they point at, which is that this is the only suite row inside
    # `docker run` and therefore the only one with a 64 MB /dev/shm.
    #
    # Until then this row is honestly red rather than dishonestly green, which is what
    # gating means.
    continue-on-error: false
    # This row builds its own MPICH inside the container on a cache miss, which
    # the shards cannot share -- they are four jobs on four runners, so a cold
    # cache costs four 32-bit builds in parallel. That is runner time rather than
    # wall time, it happens only when install-mpich.sh changes, and the
    # alternative is mpif's prefix-as-artifact pattern with a build job in front.
    # Worth knowing that sharding is what would make that pattern pay here: the
    # reason it was not adopted is that each prefix had exactly one consumer, and
    # now the i386 prefix has four.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      # The same four slices the 64-bit legs use, for the same reason and so the
      # two cannot drift; ci-scripts/suite/README.md has the measured costs.
      matrix:
        shard:
          - name: coll
            args: "--dirs=coll"
          - name: rma
            args: "--dirs=rma"
          - name: p2p
            args: "--dirs=threads,pt2pt,part"
          - name: rest
            args: "--skip-dirs=coll,rma,threads,pt2pt,part"
    steps:
      - uses: actions/checkout@v6

      # Created before `docker run`, or the daemon makes it root-owned at a mode
      # the collect step below cannot read.
      - name: Set up paths
        run: |
          echo "SUITE_OUT=${RUNNER_TEMP}/suite-i386" >>"${GITHUB_ENV}"
          mkdir -p "${RUNNER_TEMP}/suite-i386"

      # The prefix is at /out/opt/mpich-5.0.1 *inside* the container whatever the
      # host mounted /out from, which is what makes it cacheable at all: an
      # installed MPI bakes absolute paths into mpicc, its RPATHs and its libtool
      # files, and on the next run those have to mean the same thing. This job is
      # the only one that builds a 32-bit MPICH, so unlike the rows above it may
      # save the cache itself without racing anyone.
      - name: Restore the 32-bit MPICH installation
        id: cache-mpi
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/suite-i386/opt
          key: mpi-i386-5.0.1-${{ hashFiles('ci-scripts/install-mpich.sh') }}

      # **Diagnostics for one unexplained event, not a fix.** In run 32155423441
      # this row died 51 minutes in with "The runner has received a shutdown
      # signal" and nothing in its own log -- no build error, no test failure, no
      # message at all -- which is what a runner losing its host looks like from
      # inside the job. The two candidates it could plausibly be are disk and
      # memory: this is the only row that builds an MPI from source *and* compiles
      # some 900 test programs into the same RUNNER_TEMP, and its ranks are 32-bit
      # processes on a 64-bit host. So the space the other rows do not need is
      # reclaimed, and what was available is printed on both sides of the
      # container. If it recurs, these numbers are what says which of the two it
      # was; if it does not, they cost twenty seconds.
      - name: Make room, and record what there was
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          echo "::group::disk and memory before"; df -h /; free -m; echo "::endgroup::"

      # ci-scripts/suite/i386-suite.sh is what runs inside: it installs the
      # toolchain, builds MPICH from source unless the restore above already put
      # it there, asserts that pointers really are 4 bytes -- a 64-bit prefix
      # restored from a mislabelled cache would otherwise run the whole suite and
      # report a result about the wrong architecture -- launches two ranks with no
      # wrapper involved, and hands over to run-suite.sh.
      - name: Run the suite in a linux/386 container
        env:
          MPIABI_IMAGE: i386/debian:trixie-slim
          MPIABI_LINUX_SCRIPT: /src/ci-scripts/suite/i386-suite.sh
          MPIABI_LINUX_OUT: ${{ runner.temp }}/suite-i386
          MPIABI_LINUX_ARGS: --xfail=xfail-ci-mpich.txt --xfail=xfail-ci-mpich-i386.txt --flaky=flaky-ci-mpich.txt ${{ matrix.shard.args }}
        run: ci-scripts/run-linux-docker.sh mpich

      - name: What was left afterwards
        if: always()
        run: |
          echo "::group::disk and memory after"; df -h /; free -m; echo "::endgroup::"

      # Saved only when the prefix is actually complete. The step above exits
      # non-zero for a failed gate as readily as for a failed build, so its status
      # cannot be the predicate; what can is whether the two programs a later run
      # would need are there.
      - name: Is the 32-bit installation complete?
        id: probe
        if: always()
        run: |
          if [[ -x ${SUITE_OUT}/opt/mpich-5.0.1/bin/mpicc && \
                -x ${SUITE_OUT}/opt/mpich-5.0.1/bin/mpiexec ]]; then
              echo "complete=true" >>"${GITHUB_OUTPUT}"
          else
              echo "complete=false" >>"${GITHUB_OUTPUT}"
          fi

      - name: Save the 32-bit MPICH installation
        if: always() && steps.probe.outputs.complete == 'true' && steps.cache-mpi.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/suite-i386/opt
          key: ${{ steps.cache-mpi.outputs.cache-primary-key }}

      # Root inside the container wrote these, so they are root-owned on the
      # host; world-readable, which is all the copy needs.
      - name: Collect the TAP file and the suite's logs
        if: always()
        run: |
          mkdir -p suite-artifact
          cp -f "${SUITE_OUT}/suite/summary.tap" suite-artifact/ || true
          cp -f "${SUITE_OUT}/suite"/*.log suite-artifact/ || true
          ls -l suite-artifact

      - name: Keep the TAP file and the suite's logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: suite-mpich-i386-${{ matrix.shard.name }}
          path: suite-artifact
          retention-days: 30
