# Why the `i386 / rest` shard is red, measured rather than guessed.
#
# That shard is the one leg of the five-row suite matrix that has never finished:
# it dies at 49-52 minutes with "the hosted runner lost communication with the
# server", and ci-scripts/suite/xfail-ci-mpich-i386.txt is empty for its
# directories because a killed job produces no result to triage. Run 32425661806
# is the latest instance and it is worse than the record so far says: **the
# killed job's log is not retained either.** `gh run view --job` answers "log not
# found" and the run's own log archive has no entry for that job at all, so the
# "everything on stdout, because a killed job keeps its log" method that answered
# the rma question (ci-scripts/suite/README.md, "Round two") does not reach this
# failure. Whatever this probe measures, it has to measure inside a job that ends
# on its own terms.
#
# **One run of that shard did leave a log**, because it was cancelled by a newer
# push at 24 minutes rather than killed: job 96590527783 of run 32420200083. It
# says something no list on this branch records yet.
#
#   - **172 test failures, 139 of them SIGBUS** ("EXIT STRING: Bus error
#     (signal 7)", hydra's exit code 135), spread over almost every directory in
#     the shard: `info` 12 of 12, `io` 31 of 31, `datatype` 29 of 71, every
#     `errors/*` subdirectory. The same shard over the same MPICH 5.0.1 and the
#     same wrapper build fails 33 tests on x86_64 and all 33 are listed. So this
#     is ~140 ILP32-only failures of one shape, where the ILP32 delta list has
#     eleven lines.
#   - **`io` took 18 minutes** where x86_64 spends 20 seconds, with two stalls of
#     147 s and 882 s inside it. Everything else in the shard took 2.5 minutes.
#   - The first SIGBUS lands 13 seconds into `datatype`, after `attr` and `comm`
#     have run 71 tests clean.
#
# **The hypothesis this probe tests is that most of that is one flag, and it is
# not about 32 bits at all.** i386 is the only suite row that runs inside `docker
# run` -- the reason is in ci-scripts/suite/i386-suite.sh's header, a 32-bit
# userspace cannot host the runner's own x86_64 node actions -- and
# ci-scripts/run-linux-docker.sh passes no `--shm-size`, so that container gets
# Docker's default **64 MB /dev/shm**. The four 64-bit rows run directly on the
# runner, where /dev/shm is half of 16 GB. MPICH's ch4:shm maps its shared
# segments there, and SIGBUS is precisely what touching a page of a mapping the
# tmpfs cannot back looks like -- it is not a signal x86 raises for the
# misaligned access ILP32 might otherwise be blamed for. A rank that dies leaves
# its segment behind, which would explain why 71 tests pass before the first one
# fails.
#
# It would also explain three lines in xfail-ci-mpich-i386.txt that are filed as
# "not yet attributed, and ILP32-only": `coll/bcast*` at 4-32 ranks reporting
# "BAD TERMINATION" without a signal quoted, and `rma/win_large_shm` asserting
# `map_entry != NULL` in ch4_impl.h -- all three are requests for more shared
# memory than 64 MB.
#
# **The measurement is the same shard twice, one variable apart**: the default
# /dev/shm and 8 GB of it, same image, same hour, same restored prefix. The
# README's "a same-run control" rule, which is there because `transpose7` once
# survived in one run and killed the runner in the next. Each leg also
#
#   - prints /dev/shm's size, its contents and free memory every ten seconds, so
#     a leak is visible as it happens rather than inferred from the wreckage;
#   - leaves `io` out (`--skip-dirs` adds it to the four the shard already
#     skips), because 18 of the shard's minutes are in that one directory and the
#     storm reproduces in the 2.5 minutes that are not. `io` is the next probe,
#     not this one;
#   - runs two of the SIGBUS-ing tests standalone under gdb, and again with
#     MPICH's own mpicc and no wrapper in the path. A backtrace names the library
#     the signal lands in, and the native leg is the S7 method the rest of this
#     branch used for "is it ours" -- if a test SIGBUSes with no wrapper present,
#     no line of ours is at fault.
#
# RUNTESTS_VERBOSE=1, for the reason the rma probe needed it: runtests prints
# nothing for a passing test, so without it the last line before a stall is a
# directory header rather than a test name.
#
# workflow_dispatch plus a branch-scoped push, because GitHub only offers
# dispatch for workflows already on the default branch. Disposable, like the rma
# and errcount probes: delete it with the branch once the answer is written into
# ci-scripts/suite/README.md.

name: i386 shm probe

on:
  push:
    branches: [investigate-rma-dtp-openmpi5]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: i386 shm / ${{ matrix.shm.name }}
    runs-on: ubuntu-24.04
    continue-on-error: true
    # Well under the 49-52 minute wall this environment reclaims runners at. The
    # leg is a 2.5-minute shard plus a wrapper build, a suite configure and two
    # gdb runs; if it approaches this limit something has gone wrong that is
    # itself the finding.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shm:
          # **The control passes no flag at all**, rather than passing Docker's
          # documented 64 MB default back to it: the point of comparison is what
          # ci-scripts/run-linux-docker.sh produces on this runner today, and the
          # probe prints the size it actually got rather than assuming it.
          - name: default
            flag: ""
          # Enough that no test in the suite can be short of it.
          - name: 8g
            flag: "--shm-size=8g"
          # **The io directory, which the two legs above leave out.** It is where
          # 18 of the shard's 20 minutes go and where the one surviving log ends:
          # `simple_collective` took 147 s and `external32_derived_dtype` hit
          # hydra's 180-second limit and then could not be killed --
          # "unable to send signal downstream" -- with the runner shutdown
          # message arriving seconds later. A shard that stops crashing may still
          # not finish, so this asks whether the stalls are the same problem, with
          # the shm question already answered in its favour and those two tests as
          # the ones it blames.
          - name: io-8g
            flag: "--shm-size=8g"
            dirs: "--dirs=io"
            tests: "io/simple_collective io/external32_derived_dtype"
    steps:
      - uses: actions/checkout@v6

      - name: Set up paths
        run: |
          echo "SUITE_OUT=${RUNNER_TEMP}/suite-i386" >>"${GITHUB_ENV}"
          mkdir -p "${RUNNER_TEMP}/suite-i386"

      # Restore-only, with the key the suite-i386 job saves under: this probe
      # must not write that cache, and on a hit it starts with a working 32-bit
      # MPICH instead of spending 20 minutes building one. A miss is worth
      # knowing about, hence the echo.
      - name: Restore the 32-bit MPICH installation
        id: cache-mpi
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/suite-i386/opt
          key: mpi-i386-5.0.1-${{ hashFiles('ci-scripts/install-mpich.sh') }}

      - name: Room, and what there was
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          echo "cache hit: ${{ steps.cache-mpi.outputs.cache-hit }}"
          df -h /; free -m
          echo "/dev/shm on the runner itself, for comparison with the container's:"
          df -h /dev/shm

      # `docker run` by hand rather than through ci-scripts/run-linux-docker.sh,
      # for the one reason this probe exists: that script passes no --shm-size,
      # and --shm-size is the variable under test. Everything else -- /src
      # read-only, /out writable, SRC=/src -- is that script's contract,
      # restated, so the only difference between this leg and the CI row it is
      # about is the flag.
      - name: Run the probe in a linux/386 container
        run: |
          docker run --rm ${{ matrix.shm.flag }} \
            -v "${GITHUB_WORKSPACE}:/src:ro" \
            -v "${SUITE_OUT}:/out" \
            -e SRC=/src \
            -e RUNTESTS_VERBOSE=1 \
            -e MPIABI_PROBE_DIRS="${{ matrix.shm.dirs }}" \
            -e MPIABI_PROBE_TESTS="${{ matrix.shm.tests }}" \
            i386/debian:trixie-slim \
            bash /src/ci-scripts/suite/i386-shm-probe.sh

      - name: What was left afterwards
        if: always()
        run: |
          df -h /; free -m

      - name: Keep the TAP file and the suite's logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: i386-shm-${{ matrix.shm.name }}
          path: |
            ${{ runner.temp }}/suite-i386/suite/summary.tap
            ${{ runner.temp }}/suite-i386/suite/*.log
          if-no-files-found: warn
          retention-days: 30
